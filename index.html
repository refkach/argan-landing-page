<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argan Naturel</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="/image/logo.png" alt="image argan oil">
        </div>
        <nav class="nav-links">
            <ul class="links">
                <li><a href="#hero">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero" id="hero">
        <div class="cover">
            <img src="/image/hero.jpeg" alt="imageoil">
        </div>
        <div class="description">
            <h1>Natural beauty for your skin and hair</h1>
            <p>Discover the benefits of pure argan oil from Moroccan nature.</p>
            <div class="button">
                <button>SHOP NOW</button>
            </div>
        </div>
    </section>
    <section class="about" id="about">
        <div class="container">
            <div class="card">
                <h2>Nourishes hair</h2>
                <img src="/image/Hair Oil __ Growth + Shine.jpeg"alt="hair">
                <button>More</button>

            </div>
            <div class="card">
                <h2>Moisturizes the skin</h2>
                <img src="/image/skin.jpeg"alt="skin">
                <button>More</button>

            </div>
            <div class="card">
                <h2>Rich in vitamin E</h2>
                <img src="/image/vitamine.jpeg"alt="vitamine">
                <button>More</button>

            </div>
        </div>

    </section>
    <section class="contact" id="contact">
        <form action="">
        <label for="name">Your Name</label>
        <input id="name" name="text" type="text" placeholder="Enter your name">

        <label for="email">Your Email</label>
        <input id="email" name="email" type="email" placeholder="Enter your email">

        <input type="submit" value="Send">
    </form>
    </section>
    <footer>
        <div class="crypt">
            <p>© Copyright BY refka| 2025</p>
        </div>
        <div class="social-media">
                <a href="#"><i class="fab fa-facebook"></i> Facebook</a>
                <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
                <a href="#"><i class="fab fa-linkedin"></i> LinkedIn</a>
    
        </div>
    </footer>
    
</body>
</html>
